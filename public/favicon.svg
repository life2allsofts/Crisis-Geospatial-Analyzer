<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M 50 6 L 86 20 C 86 56 68 84 50 94 C 32 84 14 56 14 20 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Subtle Top Tri-color Ghana Accent Border Line -->
  <path d="M 32 15 L 44 19 L 56 19 L 68 15" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Radar / Elevation Iso-Contours -->
  <path d="M 28 38 Q 50 30 72 38" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M 24 50 Q 50 42 76 50" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M 28 62 Q 50 56 72 62" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Dynamic Flood River / Wave Curves -->
  <path d="M 20 66 Q 34 52 50 64 T 80 58 C 76 74 64 85 50 90 C 38 84 26 76 20 66 Z" fill="url(#waveGrad)" opacity="0.85" />
  <path d="M 22 58 Q 38 48 50 58 T 78 52" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Geo Beacon / Navigation Star -->
  <circle cx="50" cy="38" r="8" fill="#0f172a" stroke="#eab308" stroke-width="2.5" filter="url(#glow)" />
  <polygon points="50,32 52,36 56,38 52,40 50,44 48,40 44,38 48,36" fill="#eab308" />
  <circle cx="50" cy="38" r="2" fill="#ffffff" />

  <!-- Satellite Signal Ring -->
  <circle cx="50" cy="38" r="14" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" />
</svg>
